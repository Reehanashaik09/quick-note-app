<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Note Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Quick Notes</h1>
        
        <!-- Form to add notes -->
        <form id="note-form">
            <input type="text" id="note-title" placeholder="Note Title..." required>
            <textarea id="note-content" placeholder="Write your note here..." rows="3" required></textarea>
            <button type="submit">Add Note</button>
        </form>

        <!-- Container to display notes -->
        <div id="notes-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
